[package]
name = "bevy-me"
version = "0.0.0"
edition = "2024"
description = "Bevy adapter for laye-me. IdentityPlugin inserts an IdentityRes resource that systems mutate on login."
license = "MIT"

[lints]
workspace = true

[dependencies]
laye-me = { path = "../me" }
bevy_app = { version = "=0.19.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.0", default-features = false, features = ["std"] }
