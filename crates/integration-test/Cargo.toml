[package]
name = "integration-test"
version = "0.0.0"
edition = "2024"
description = "End-to-end tests that spawn real binaries (relaye) on loopback."
license = "MIT"
publish = false

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.47.1", features = ["full"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "=0.23.41", features = ["ring"] }
futures = "=0.3.32"
