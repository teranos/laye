<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://sbvh.nl https://*.sbvh.nl;"
    />
    <meta name="referrer" content="no-referrer" />
    <title>laye · identity broker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 3rem auto;
        padding: 0 1rem;
        background: #0a0e14;
        color: #b3b1ad;
        line-height: 1.5;
      }
      h1 { font-size: 1.1rem; margin: 0 0 1rem; }
      #status { padding: .5rem 0; }
      .phrase {
        font-family: ui-monospace, monospace;
        word-spacing: 0.4rem;
        line-height: 1.9;
        padding: 1rem;
        background: #0d1017;
        border: 1px solid #23272e;
        margin: 1rem 0;
        white-space: pre-wrap;
      }
      button {
        padding: .5rem 1rem;
        background: #23272e;
        color: #b3b1ad;
        border: 1px solid #45505a;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        font-family: ui-monospace, monospace;
        padding: .5rem;
        background: #0d1017;
        color: #b3b1ad;
        border: 1px solid #23272e;
        margin: .5rem 0;
      }
      .err { color: #f07178; padding: .5rem 0; min-height: 1.5rem; }
      .hidden { display: none; }
      code { background: #0d1017; padding: 0 .3rem; }
    </style>
  </head>
  <body>
    <h1>laye · identity broker</h1>
    <div id="status">loading…</div>

    <div id="phrase-section" class="hidden">
      <p>Your BIP39 recovery phrase. Write it down before continuing — losing it means losing the identity forever.</p>
      <div class="phrase" id="phrase"></div>
      <button id="ack">I've saved it</button>
    </div>

    <div id="ready-section" class="hidden">
      <p>Identity ready. This tab answers <code>postMessage</code> pubkey/sign requests from <code>*.sbvh.nl</code>.</p>
      <p>Import a different phrase to switch identity:</p>
      <textarea id="import" rows="3" placeholder="paste 24 words…"></textarea>
      <button id="import-btn">import</button>
      <div class="err" id="import-err"></div>
    </div>

    <script type="module" src="./broker.js"></script>
  </body>
</html>
