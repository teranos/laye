<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>laye · identity broker</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>laye</h1>
      <p class="tag">identity broker</p>

      <section id="intro">
        <p>
          This origin owns identity ceremonies for laye apps. Pick a
          provider — each one binds an account you already have to the
          peer key on the wire.
        </p>
      </section>

      <section id="chooser">
        <a class="provider" href="./mastodon/">
          <span class="mark" data-provider="mastodon" aria-hidden="true">M</span>
          <span class="name">Mastodon</span>
        </a>
        <a class="provider" href="./atproto/">
          <span class="mark" data-provider="atproto" aria-hidden="true">B</span>
          <span class="name">Bluesky · atproto</span>
        </a>
        <a class="provider" href="./nostr/">
          <span class="mark" data-provider="nostr" aria-hidden="true">N</span>
          <span class="name">Nostr</span>
        </a>
      </section>

      <section class="status">
        <div>build: <span id="build">unknown</span></div>
        <div>origin: <span id="origin"></span></div>
      </section>
    </main>
    <script type="module">
      // Chooser stashes the peer + state URL params into sessionStorage
      // so every sub-page can read them without a further URL hop.
      // This is the ONE place that reads the query string on entry.
      const params = new URLSearchParams(location.search);
      const peer = params.get("peer");
      const state = params.get("state");
      if (peer) sessionStorage.setItem("laye_peer_pubkey_hex", peer);
      if (state) sessionStorage.setItem("laye_main_state", state);

      const build = document.getElementById("build");
      const origin = document.getElementById("origin");
      origin.textContent = location.origin + "/me/";
      try {
        const r = await fetch("./build-info.json", { cache: "no-cache" });
        if (r.ok) {
          const info = await r.json();
          build.textContent = `${info.short} · ${info.built_at}`;
        }
      } catch (_) {}
    </script>
  </body>
</html>
