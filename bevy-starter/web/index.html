<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bevy-starter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="login-screen">
      <h1>bevy-starter</h1>
      <button class="login" data-provider="atproto">Log in with ATProto</button>
      <button class="login" data-provider="mastodon">Log in with Mastodon</button>
    </div>

    <script type="module">
      import { BrowserOAuthClient } from "https://esm.sh/@atproto/oauth-client-browser@0.3.19";

      const DB = "bevy-starter";
      const STORE = "identity";
      const KEY = "self";

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = (ev) => {
            const db = ev.target.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function loadIdentity() {
        const db = await openDb();
        return await new Promise((resolve, reject) => {
          const req = db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      }
      async function saveIdentity(record) {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const req = db.transaction(STORE, "readwrite").objectStore(STORE).put(record, KEY);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      const clientMetadataUrl = new URL("./oauth-client-metadata.json", location.href).toString();
      const atproto = new BrowserOAuthClient({
        clientMetadata: await (await fetch(clientMetadataUrl)).json(),
        handleResolver: "https://bsky.social",
      });

      const initResult = await atproto.init();
      if (initResult?.session) {
        const s = initResult.session;
        await saveIdentity({ provider: "atproto", did: s.did, handle: s.handle ?? null });
      }

      const existing = await loadIdentity();
      if (existing) document.body.classList.add("identified");

      document.querySelector('[data-provider="atproto"]').onclick = async () => {
        const handle = prompt("your ATProto handle (e.g. you.bsky.social):");
        if (!handle) return;
        await atproto.signIn(handle, { scope: "atproto" });
      };
      document.querySelector('[data-provider="mastodon"]').onclick = async () => {
        const instance = (prompt("your Mastodon instance (e.g. mastodon.social):") || "").trim();
        if (!instance) return;
        const app = await (await fetch(`https://${instance}/api/v1/apps`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            client_name: "bevy-starter",
            redirect_uris: location.origin + location.pathname,
            scopes: "read",
            website: "https://bevy-starter.sbvh.nl/",
          }),
        })).json();
        sessionStorage.setItem("mastodon-app", JSON.stringify({ instance, client_id: app.client_id, client_secret: app.client_secret }));
        const params = new URLSearchParams({
          client_id: app.client_id,
          scope: "read",
          redirect_uri: location.origin + location.pathname,
          response_type: "code",
        });
        location.href = `https://${instance}/oauth/authorize?${params.toString()}`;
      };

      const url = new URL(location.href);
      const code = url.searchParams.get("code");
      const mastoState = sessionStorage.getItem("mastodon-app");
      if (code && mastoState) {
        const { instance, client_id, client_secret } = JSON.parse(mastoState);
        sessionStorage.removeItem("mastodon-app");
        const tokenResp = await (await fetch(`https://${instance}/oauth/token`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            client_id, client_secret,
            redirect_uri: location.origin + location.pathname,
            grant_type: "authorization_code",
            code,
            scope: "read",
          }),
        })).json();
        const cred = await (await fetch(`https://${instance}/api/v1/accounts/verify_credentials`, {
          headers: { authorization: `Bearer ${tokenResp.access_token}` },
        })).json();
        await saveIdentity({ provider: "mastodon", instance, id: cred.id, handle: cred.acct });
        url.searchParams.delete("code");
        url.searchParams.delete("state");
        history.replaceState(null, "", url.toString());
        document.body.classList.add("identified");
      }
    </script>
    <canvas id="bevy"></canvas>
    <div id="version-switcher">
      <select id="version-select"><option>loading…</option></select>
    </div>
    <div id="overlay">
      <div id="status">booting…</div>
      <button id="panic-btn" disabled>trigger rust panic</button>
      <div id="panic"></div>
      <div id="errors"></div>
    </div>
    <div id="bevy-starter-loading">
      <div id="bevy-starter-loading-text">loading bevy-starter</div>
      <progress></progress>
    </div>

    <script type="module">
      (async () => {
        const parts = location.pathname.replace(/^\/+|\/+$/g, "").split("/");
        const current = parts[0] || "main";
        const sel = document.getElementById("version-select");
        try {
          const r = await fetch("/versions.json", { cache: "no-cache" });
          const branches = (await r.json()).filter((b) => b !== "main");
          const versions = ["main", ...branches];
          sel.innerHTML = "";
          for (const v of versions) {
            const o = document.createElement("option");
            o.value = v;
            o.textContent = v;
            if (v === current) o.selected = true;
            sel.appendChild(o);
          }
          sel.addEventListener("change", () => {
            location.pathname = sel.value === "main" ? "/" : `/${sel.value}/`;
          });
        } catch (e) {
          sel.innerHTML = `<option>${current}</option>`;
        }
      })();
    </script>

    <script type="module">
      const DB = "bevy-starter";
      const STORE = "identity";
      const KEY = "self";

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = (ev) => {
            const db = ev.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.createObjectStore(STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      window.__bevyStarterLoadIdentity = async () => {
        const db = await openDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const req = tx.objectStore(STORE).get(KEY);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      };

      window.__bevyStarterSaveIdentity = async (bytes) => {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          const req = tx.objectStore(STORE).put(bytes, KEY);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      };

      window.__bevyStarterStatus = (msg) => {
        document.getElementById("status").textContent = msg;
      };

      const panicEl = document.getElementById("panic");
      function showPanic(source, detail) {
        panicEl.textContent = `${source}\n\n${detail}`;
        panicEl.classList.add("shown");
      }
      window.__bevyStarterPanic = (envelope) => showPanic("rust panic hook", envelope);

      const errorsEl = document.getElementById("errors");
      window.__bevyStarterError = (msg) => {
        const line = document.createElement("div");
        line.className = "err-line";
        line.textContent = msg;
        errorsEl.appendChild(line);
      };
      window.addEventListener("error", (ev) => {
        const detail = ev.error?.stack ?? ev.error?.message ?? ev.message ?? "(no detail)";
        showPanic("window.error", detail);
      });
      window.addEventListener("unhandledrejection", (ev) => {
        const detail = ev.reason?.stack ?? ev.reason?.message ?? String(ev.reason);
        showPanic("unhandledrejection", detail);
      });

      const loadingText = document.getElementById("bevy-starter-loading-text");
      const loadingBar = document.querySelector("#bevy-starter-loading progress");
      function fmtMB(bytes) {
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }
      function updateProgress(loaded, total) {
        if (!loadingText || !loadingBar) return;
        if (total > 0) {
          const pct = Math.floor((loaded / total) * 100);
          loadingBar.value = loaded;
          loadingBar.max = total;
          loadingText.textContent = `loading bevy-starter · ${pct}% · ${fmtMB(loaded)}/${fmtMB(total)}`;
        } else {
          loadingText.textContent = `loading bevy-starter · ${fmtMB(loaded)}`;
        }
      }
      async function streamWasmBytes(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`fetch ${url} → HTTP ${response.status}`);
        const total = parseInt(response.headers.get("content-length") ?? "0", 10);
        const body = response.body;
        if (!body) throw new Error(`fetch ${url} → response.body missing`);
        const reader = body.getReader();
        const chunks = [];
        let loaded = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          if (value) {
            chunks.push(value);
            loaded += value.length;
            updateProgress(loaded, total);
          }
        }
        const bytes = new Uint8Array(loaded);
        let offset = 0;
        for (const chunk of chunks) {
          bytes.set(chunk, offset);
          offset += chunk.length;
        }
        return bytes;
      }

      const wasm = await import("./bevy_starter.js");
      const wasmBytes = await streamWasmBytes("./bevy_starter_bg.wasm");
      await wasm.default({ module_or_path: wasmBytes });
      document.body.classList.add("loaded");

      const btn = document.getElementById("panic-btn");
      btn.disabled = false;
      btn.onclick = () => {
        try {
          wasm.trigger_panic_demo();
        } catch (e) {
          showPanic("wasm aborted after panic", e?.stack ?? e?.message ?? String(e));
        }
      };
    </script>
  </body>
</html>
